version: '3.9'

services:
  # Backend API & Admin (Django + Gunicorn or Runserver)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ndbt_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - PORT=8000
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
      - /app/frontend/node_modules
    command: python manage.py runserver 0.0.0.0:8000

  # Frontend Dev Server (Vite with Hot Module Replacement on port 5173)
  frontend:
    image: node:20-alpine
    container_name: ndbt_frontend
    restart: unless-stopped
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
